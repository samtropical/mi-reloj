<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Mi Reloj"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<link
  rel="icon"
  href="./icon.svg"
  type="image/svg+xml"
>

<title>Mi Reloj</title>

<style>

:root{
  color-scheme:light dark;

  --bg:#f2f2f7;
  --card:#ffffff;
  --text:#111114;
  --muted:#777780;
  --soft:#e9e9ee;
  --line:rgba(0,0,0,.08);
  --primary:#111114;
  --primaryText:#ffffff;
}

@media(prefers-color-scheme:dark){

  :root{
    --bg:#000000;
    --card:#1c1c1e;
    --text:#f5f5f7;
    --muted:#98989f;
    --soft:#2c2c2e;
    --line:rgba(255,255,255,.10);
    --primary:#ffffff;
    --primaryText:#000000;
  }

}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
}

body{

  margin:0;

  min-height:100vh;

  background:var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  padding:
    max(25px,env(safe-area-inset-top))
    17px
    max(30px,env(safe-area-inset-bottom));

}

.app{
  max-width:520px;
  margin:auto;
}

.version{

  width:max-content;

  margin:
    10px
    auto
    0;

  background:var(--soft);

  padding:
    7px
    12px;

  border-radius:999px;

  font-size:12px;

  font-weight:700;

  color:var(--muted);

}

.hero{

  text-align:center;

  padding:
    22px
    0
    30px;

}

.date{

  color:var(--muted);

  font-size:16px;

  font-weight:600;

  text-transform:capitalize;

  margin-bottom:12px;

}

.time{

  font-size:
    clamp(
      70px,
      21vw,
      105px
    );

  font-weight:720;

  line-height:.95;

  letter-spacing:-.07em;

  font-variant-numeric:
    tabular-nums;

}

.seconds{

  color:var(--muted);

  margin-top:14px;

  font-size:17px;

}

.tabs{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  background:var(--soft);

  border-radius:20px;

  padding:5px;

  margin-bottom:16px;

}

button,
input{
  font:inherit;
}

button{

  border:0;

  cursor:pointer;

  touch-action:manipulation;

}

.tab{

  min-height:48px;

  border-radius:16px;

  background:transparent;

  color:var(--muted);

  font-weight:650;

}

.tab.active{

  background:var(--card);

  color:var(--text);

  box-shadow:
    0
    2px
    8px
    rgba(0,0,0,.08);

}

.card{

  background:var(--card);

  border:
    1px
    solid
    var(--line);

  border-radius:28px;

  padding:22px;

}

.hidden{
  display:none !important;
}

.info{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:20px;

}

.infoTitle{

  font-size:19px;

  font-weight:700;

}

.muted{

  color:var(--muted);

  font-size:14px;

  margin-top:5px;

}

.display{

  font-size:54px;

  font-weight:700;

  letter-spacing:-.04em;

  font-variant-numeric:
    tabular-nums;

  text-align:center;

  padding:
    25px
    0;

}

.actions{

  display:flex;

  justify-content:center;

  gap:9px;

  flex-wrap:wrap;

}

.btn{

  min-height:51px;

  border-radius:17px;

  padding:
    0
    21px;

  background:var(--primary);

  color:var(--primaryText);

  font-weight:650;

}

.btn.secondary{

  background:var(--soft);

  color:var(--text);

}

.btn:disabled{
  opacity:.35;
}

.fields{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:12px;

}

label{

  color:var(--muted);

  font-size:14px;

}

input{

  display:block;

  width:100%;

  min-height:52px;

  margin-top:7px;

  border:0;

  border-radius:16px;

  background:var(--soft);

  color:var(--text);

  padding:
    0
    14px;

  font-size:20px;

}

.full{

  width:100%;

  margin-top:14px;

}

.status{

  text-align:center;

  color:var(--muted);

  min-height:22px;

  margin-bottom:15px;

}

.laps{
  margin-top:20px;
}

.lap{

  display:flex;

  justify-content:
    space-between;

  border-top:
    1px
    solid
    var(--line);

  padding:
    12px
    2px;

  font-variant-numeric:
    tabular-nums;

}

.lap span{
  color:var(--muted);
}

.finished{

  animation:
    pulse
    .55s
    ease
    5;

}

@keyframes pulse{

  50%{

    transform:
      scale(1.08);

    opacity:.55;

  }

}

.footer{

  text-align:center;

  color:var(--muted);

  font-size:12px;

  margin-top:20px;

}

</style>

</head>

<body>

<main class="app">

<div class="version">
  MI RELOJ · V3
</div>


<section class="hero">

  <div
    id="date"
    class="date">
  </div>

  <div
    id="time"
    class="time">
    --:--
  </div>

  <div
    id="seconds"
    class="seconds">
    -- segundos
  </div>

</section>


<nav class="tabs">

  <button
    class="tab active"
    data-page="clock">
    Reloj
  </button>

  <button
    class="tab"
    data-page="stopwatch">
    Cronómetro
  </button>

  <button
    class="tab"
    data-page="timer">
    Temporizador
  </button>

</nav>


<section
  id="clock"
  class="card page">

  <div class="info">

    <div>

      <div class="infoTitle">
        Hora local
      </div>

      <div class="muted">
        Actualización automática
      </div>

    </div>

    <div
      id="timezone"
      class="muted">
    </div>

  </div>

</section>


<section
  id="stopwatch"
  class="card page hidden">

  <div
    id="swDisplay"
    class="display">

    00:00.0

  </div>


  <div class="actions">

    <button
      id="swStart"
      class="btn">

      Iniciar

    </button>


    <button
      id="swLap"
      class="btn secondary"
      disabled>

      Vuelta

    </button>


    <button
      id="swReset"
      class="btn secondary">

      Reiniciar

    </button>

  </div>


  <div
    id="lapList"
    class="laps hidden">
  </div>

</section>


<section
  id="timer"
  class="card page hidden">


  <div class="fields">

    <label>

      Minutos

      <input
        id="minutes"
        type="number"
        inputmode="numeric"
        value="1"
        min="0"
        max="999">

    </label>


    <label>

      Segundos

      <input
        id="timerSeconds"
        type="number"
        inputmode="numeric"
        value="0"
        min="0"
        max="59">

    </label>

  </div>


  <button
    id="prepareTimer"
    class="btn full">

    Preparar

  </button>


  <div
    id="timerDisplay"
    class="display">

    01:00

  </div>


  <div
    id="timerStatus"
    class="status">

    Preparado

  </div>


  <div class="actions">


    <button
      id="timerStart"
      class="btn">

      Iniciar

    </button>


    <button
      id="timerReset"
      class="btn secondary">

      Reiniciar

    </button>


  </div>

</section>


<div class="footer">
  Mi Reloj · versión 3
</div>

</main>


<script>

const $ =
  selector =>
    document.querySelector(
      selector
    );


/* =========================
   RELOJ
========================= */

function updateClock(){

  const now =
    new Date();


  $("#time").textContent =

    now.toLocaleTimeString(
      "es-ES",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  $("#seconds").textContent =

    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    )

    +

    " segundos";


  $("#date").textContent =

    now.toLocaleDateString(
      "es-ES",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );


  $("#timezone").textContent =

    Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone;

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   PESTAÑAS
========================= */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              tab => {

                tab.classList.toggle(
                  "active",
                  tab === button
                );

              }
            );


          document
            .querySelectorAll(
              ".page"
            )
            .forEach(
              page => {

                page.classList.add(
                  "hidden"
                );

              }
            );


          document
            .getElementById(
              button.dataset.page
            )
            .classList.remove(
              "hidden"
            );

        }
      );

    }
  );


/* =========================
   SONIDO
========================= */

let audioContext;


function unlockAudio(){

  if(!audioContext){

    audioContext =

      new (

        window.AudioContext

        ||

        window.webkitAudioContext

      )();

  }


  if(
    audioContext.state
    ===
    "suspended"
  ){

    audioContext.resume();

  }

}


function playAlarm(){

  unlockAudio();


  [
    0,
    .25,
    .50,
    .75
  ]
  .forEach(
    delay => {


      const oscillator =

        audioContext
          .createOscillator();


      const gain =

        audioContext
          .createGain();


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.setValueAtTime(

        .001,

        audioContext.currentTime
        +
        delay

      );


      gain.gain
        .exponentialRampToValueAtTime(

          .35,

          audioContext.currentTime
          +
          delay
          +
          .02

        );


      gain.gain
        .exponentialRampToValueAtTime(

          .001,

          audioContext.currentTime
          +
          delay
          +
          .18

        );


      oscillator.start(

        audioContext.currentTime
        +
        delay

      );


      oscillator.stop(

        audioContext.currentTime
        +
        delay
        +
        .20

      );

    }
  );

}


/* =========================
   CRONÓMETRO
========================= */

let swRunning =
  false;

let swStarted =
  0;

let swElapsed =
  0;

let swRAF;

let lapNumber =
  0;


function swCurrent(){

  if(swRunning){

    return (

      swElapsed

      +

      performance.now()

      -

      swStarted

    );

  }


  return swElapsed;

}


function formatSW(
  milliseconds
){

  const totalSeconds =

    Math.floor(
      milliseconds
      /
      1000
    );


  const minutes =

    Math.floor(
      totalSeconds
      /
      60
    );


  const seconds =

    totalSeconds
    %
    60;


  const tenth =

    Math.floor(
      milliseconds
      /
      100
    )
    %
    10;


  return (

    String(
      minutes
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      seconds
    ).padStart(
      2,
      "0"
    )

    +

    "."

    +

    tenth

  );

}


function renderSW(){

  $("#swDisplay").textContent =

    formatSW(
      swCurrent()
    );


  if(swRunning){

    swRAF =

      requestAnimationFrame(
        renderSW
      );

  }

}


$("#swStart")
  .addEventListener(
    "click",
    () => {


      if(swRunning){


        swElapsed +=

          performance.now()

          -

          swStarted;


        swRunning =
          false;


        cancelAnimationFrame(
          swRAF
        );


        $("#swStart").textContent =
          "Continuar";


        $("#swLap").disabled =
          true;


      }else{


        swStarted =

          performance.now();


        swRunning =
          true;


        $("#swStart").textContent =
          "Pausar";


        $("#swLap").disabled =
          false;


        renderSW();

      }

    }
  );


$("#swLap")
  .addEventListener(
    "click",
    () => {


      if(!swRunning){
        return;
      }


      lapNumber++;


      const list =
        $("#lapList");


      list.classList.remove(
        "hidden"
      );


      const row =

        document.createElement(
          "div"
        );


      row.className =
        "lap";


      row.innerHTML =

        "<span>Vuelta "

        +

        lapNumber

        +

        "</span>"

        +

        "<strong>"

        +

        formatSW(
          swCurrent()
        )

        +

        "</strong>";


      list.prepend(
        row
      );

    }
  );


$("#swReset")
  .addEventListener(
    "click",
    () => {


      swRunning =
        false;


      swElapsed =
        0;


      lapNumber =
        0;


      cancelAnimationFrame(
        swRAF
      );


      $("#swStart").textContent =
        "Iniciar";


      $("#swLap").disabled =
        true;


      $("#lapList").innerHTML =
        "";


      $("#lapList")
        .classList
        .add(
          "hidden"
        );


      renderSW();

    }
  );


/* =========================
   TEMPORIZADOR
========================= */

let timerTotal =
  60;

let timerRemaining =
  60;

let timerRunning =
  false;

let timerInterval;

let deadline;


function renderTimer(){

  const minutes =

    Math.floor(
      timerRemaining
      /
      60
    );


  const seconds =

    timerRemaining
    %
    60;


  $("#timerDisplay").textContent =

    String(
      minutes
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      seconds
    ).padStart(
      2,
      "0"
    );

}


$("#prepareTimer")
  .addEventListener(
    "click",
    () => {


      unlockAudio();


      let minutes =

        Number(
          $("#minutes").value
        )
        ||
        0;


      let seconds =

        Number(
          $("#timerSeconds").value
        )
        ||
        0;


      minutes =

        Math.max(
          0,
          Math.min(
            999,
            minutes
          )
        );


      seconds =

        Math.max(
          0,
          Math.min(
            59,
            seconds
          )
        );


      timerTotal =

        Math.max(
          1,
          minutes
          *
          60
          +
          seconds
        );


      timerRemaining =
        timerTotal;


      clearInterval(
        timerInterval
      );


      timerRunning =
        false;


      $("#timerStart").textContent =
        "Iniciar";


      $("#timerStatus").textContent =
        "Preparado";


      renderTimer();

    }
  );


$("#timerStart")
  .addEventListener(
    "click",
    () => {


      unlockAudio();


      if(timerRunning){


        timerRemaining =

          Math.max(
            0,
            Math.ceil(
              (
                deadline
                -
                Date.now()
              )
              /
              1000
            )
          );


        clearInterval(
          timerInterval
        );


        timerRunning =
          false;


        $("#timerStart").textContent =
          "Continuar";


        $("#timerStatus").textContent =
          "Pausado";


        renderTimer();


        return;

      }


      if(
        timerRemaining
        <=
        0
      ){

        timerRemaining =
          timerTotal;

      }


      deadline =

        Date.now()

        +

        timerRemaining
        *
        1000;


      timerRunning =
        true;


      $("#timerStart").textContent =
        "Pausar";


      $("#timerStatus").textContent =
        "En marcha";


      timerInterval =

        setInterval(
          () => {


            timerRemaining =

              Math.max(
                0,
                Math.ceil(
                  (
                    deadline
                    -
                    Date.now()
                  )
                  /
                  1000
                )
              );


            renderTimer();


            if(
              timerRemaining
              <=
              0
            ){


              clearInterval(
                timerInterval
              );


              timerRunning =
                false;


              $("#timerStart").textContent =
                "Iniciar";


              $("#timerStatus").textContent =
                "⏰ ¡Tiempo terminado!";


              $("#timerDisplay")
                .classList
                .add(
                  "finished"
                );


              setTimeout(
                () => {

                  $("#timerDisplay")
                    .classList
                    .remove(
                      "finished"
                    );

                },
                3000
              );


              playAlarm();

            }

          },
          200
        );

    }
  );


$("#timerReset")
  .addEventListener(
    "click",
    () => {


      clearInterval(
        timerInterval
      );


      timerRunning =
        false;


      timerRemaining =
        timerTotal;


      $("#timerStart").textContent =
        "Iniciar";


      $("#timerStatus").textContent =
        "Preparado";


      renderTimer();

    }
  );


renderSW();

renderTimer();


/* =========================
   PWA / OFFLINE
========================= */

if(
  "serviceWorker"
  in
  navigator
){

  window.addEventListener(
    "load",
    () => {


      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error => {

            console.log(
              "Service Worker:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>
</html>
