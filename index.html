<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Reloj">

<link rel="manifest" href="./manifest.webmanifest">

<title>Mi Reloj</title>

<style>
:root{
  color-scheme:light dark;
  --bg:#f2f2f7;
  --card:#fff;
  --text:#111;
  --muted:#81818a;
  --line:rgba(0,0,0,.08);
  --main:#111;
  --inverse:#fff;
  --soft:#e9e9ee;
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --card:#1c1c1e;
    --text:#f5f5f7;
    --muted:#98989f;
    --line:rgba(255,255,255,.10);
    --main:#fff;
    --inverse:#000;
    --soft:#2c2c2e;
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  padding:
    max(24px,env(safe-area-inset-top))
    18px
    max(30px,env(safe-area-inset-bottom));
}

.app{
  max-width:520px;
  margin:auto;
}

.hero{
  text-align:center;
  padding:38px 0 30px;
}

.date{
  color:var(--muted);
  font-weight:600;
  text-transform:capitalize;
  margin-bottom:12px;
}

.time{
  font-size:clamp(68px,21vw,104px);
  line-height:.95;
  font-weight:700;
  letter-spacing:-.07em;
  font-variant-numeric:tabular-nums;
}

.seconds{
  color:var(--muted);
  margin-top:14px;
  font-size:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

.tab{
  min-height:50px;
  border-radius:17px;
  background:var(--card);
  color:var(--text);
  font-weight:650;
  border:1px solid var(--line);
}

.tab.active{
  background:var(--main);
  color:var(--inverse);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:22px;
}

.hidden{
  display:none!important;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
}

.info strong{
  font-size:18px;
}

.muted{
  color:var(--muted);
  font-size:14px;
}

.display{
  font-size:52px;
  text-align:center;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
  padding:24px 0;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  min-height:52px;
  padding:0 22px;
  border-radius:17px;
  background:var(--main);
  color:var(--inverse);
  font-weight:650;
}

.btn.secondary{
  background:var(--soft);
  color:var(--text);
}

.btn:disabled{
  opacity:.35;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  color:var(--muted);
  font-size:14px;
}

input{
  display:block;
  width:100%;
  min-height:52px;
  margin-top:6px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:0 14px;
  background:var(--soft);
  color:var(--text);
  font-size:19px;
}

.full{
  width:100%;
  margin-top:14px;
}

.status{
  text-align:center;
  color:var(--muted);
  min-height:22px;
  margin-bottom:14px;
}

.laps{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:10px;
}

.lap{
  display:flex;
  justify-content:space-between;
  padding:10px 2px;
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}

.lap span:first-child{
  color:var(--muted);
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:20px;
}

.finished{
  animation:pulse .7s ease 4;
}

@keyframes pulse{
  50%{
    transform:scale(1.04);
    opacity:.55;
  }
}
</style>
</head>

<body>

<main class="app">

<section class="hero">
  <div id="date" class="date"></div>
  <div id="time" class="time">--:--</div>
  <div id="seconds" class="seconds">-- segundos</div>
</section>

<nav class="tabs">
  <button class="tab active" data-page="clock">Reloj</button>
  <button class="tab" data-page="stopwatch">Cronómetro</button>
  <button class="tab" data-page="timer">Temporizador</button>
</nav>

<section id="clock" class="card page">
  <div class="info">
    <div>
      <strong>Hora local</strong>
      <div class="muted">Actualización automática</div>
    </div>
    <div id="timezone" class="muted"></div>
  </div>
</section>

<section id="stopwatch" class="card page hidden">

  <div id="swDisplay" class="display">00:00.0</div>

  <div class="actions">
    <button id="swStart" class="btn">Iniciar</button>
    <button id="swLap" class="btn secondary" disabled>Vuelta</button>
    <button id="swReset" class="btn secondary">Reiniciar</button>
  </div>

  <div id="lapList" class="laps hidden"></div>

</section>

<section id="timer" class="card page hidden">

  <div class="fields">

    <label>
      Minutos
      <input id="minutes" type="number" inputmode="numeric" min="0" max="999" value="1">
    </label>

    <label>
      Segundos
      <input id="timerSeconds" type="number" inputmode="numeric" min="0" max="59" value="0">
    </label>

  </div>

  <button id="prepareTimer" class="btn full">
    Preparar temporizador
  </button>

  <div id="timerDisplay" class="display">01:00</div>

  <div id="timerStatus" class="status">Preparado</div>

  <div class="actions">
    <button id="timerStart" class="btn">Iniciar</button>
    <button id="timerReset" class="btn secondary">Reiniciar</button>
  </div>

</section>

<div class="footer">Mi Reloj</div>

</main>

<script>

const $ = s => document.querySelector(s);

/* RELOJ */

function updateClock(){

  const now = new Date();

  $("#time").textContent =
    now.toLocaleTimeString("es-ES",{
      hour:"2-digit",
      minute:"2-digit"
    });

  $("#seconds").textContent =
    String(now.getSeconds()).padStart(2,"0") + " segundos";

  $("#date").textContent =
    now.toLocaleDateString("es-ES",{
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    });

  $("#timezone").textContent =
    Intl.DateTimeFormat().resolvedOptions().timeZone;
}

updateClock();
setInterval(updateClock,1000);


/* PESTAÑAS */

document.querySelectorAll(".tab").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".tab")
      .forEach(x=>x.classList.toggle("active",x===btn));

    document.querySelectorAll(".page")
      .forEach(x=>x.classList.add("hidden"));

    document
      .getElementById(btn.dataset.page)
      .classList.remove("hidden");

  });

});


/* SONIDO */

let audioContext;

function unlockAudio(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext || window.webkitAudioContext)();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

}

function beep(){

  unlockAudio();

  [0,.25,.5].forEach(t=>{

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 880;

    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime+t
    );

    gain.gain.exponentialRampToValueAtTime(
      .35,
      audioContext.currentTime+t+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioContext.currentTime+t+.18
    );

    oscillator.start(audioContext.currentTime+t);
    oscillator.stop(audioContext.currentTime+t+.2);

  });

}


/* CRONÓMETRO */

let swRunning = false;
let swStarted = 0;
let swElapsed = 0;
let swRAF;
let lapNumber = 0;

function currentSW(){

  return swRunning
    ? swElapsed + performance.now() - swStarted
    : swElapsed;

}

function formatSW(ms){

  const total = Math.floor(ms/1000);

  const m = Math.floor(total/60);
  const s = total%60;
  const tenth = Math.floor(ms/100)%10;

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0") +
    "." +
    tenth
  );

}

function renderSW(){

  $("#swDisplay").textContent =
    formatSW(currentSW());

  if(swRunning){
    swRAF = requestAnimationFrame(renderSW);
  }

}

$("#swStart").addEventListener("click",()=>{

  if(swRunning){

    swElapsed += performance.now()-swStarted;
    swRunning = false;

    cancelAnimationFrame(swRAF);

    $("#swStart").textContent = "Continuar";
    $("#swLap").disabled = true;

  }else{

    swStarted = performance.now();
    swRunning = true;

    $("#swStart").textContent = "Pausar";
    $("#swLap").disabled = false;

    renderSW();

  }

});

$("#swLap").addEventListener("click",()=>{

  if(!swRunning) return;

  lapNumber++;

  const list = $("#lapList");

  list.classList.remove("hidden");

  const row = document.createElement("div");

  row.className = "lap";

  row.innerHTML =
    "<span>Vuelta "+lapNumber+"</span>"+
    "<strong>"+formatSW(currentSW())+"</strong>";

  list.prepend(row);

});

$("#swReset").addEventListener("click",()=>{

  swRunning = false;
  swElapsed = 0;
  lapNumber = 0;

  cancelAnimationFrame(swRAF);

  $("#swStart").textContent = "Iniciar";
  $("#swLap").disabled = true;

  $("#lapList").innerHTML = "";
  $("#lapList").classList.add("hidden");

  renderSW();

});


/* TEMPORIZADOR */

let timerTotal = 60;
let timerRemaining = 60;
let timerRunning = false;
let timerInterval;
let deadline;

function renderTimer(){

  const m = Math.floor(timerRemaining/60);
  const s = timerRemaining%60;

  $("#timerDisplay").textContent =
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0");

}

function pauseTimer(){

  timerRemaining = Math.max(
    0,
    Math.ceil((deadline-Date.now())/1000)
  );

  clearInterval(timerInterval);

  timerRunning = false;

}

$("#prepareTimer").addEventListener("click",()=>{

  unlockAudio();

  let m = Number($("#minutes").value)||0;
  let s = Number($("#timerSeconds").value)||0;

  m = Math.max(0,Math.min(999,m));
  s = Math.max(0,Math.min(59,s));

  timerTotal = Math.max(1,m*60+s);
  timerRemaining = timerTotal;

  clearInterval(timerInterval);

  timerRunning = false;

  $("#timerStart").textContent = "Iniciar";
  $("#timerStatus").textContent = "Preparado";

  renderTimer();

});

$("#timerStart").addEventListener("click",()=>{

  unlockAudio();

  if(timerRunning){

    pauseTimer();

    $("#timerStart").textContent = "Continuar";
    $("#timerStatus").textContent = "Pausado";

    renderTimer();

    return;

  }

  if(timerRemaining<=0){
    timerRemaining = timerTotal;
  }

  deadline = Date.now() + timerRemaining*1000;

  timerRunning = true;

  $("#timerStart").textContent = "Pausar";
  $("#timerStatus").textContent = "En marcha";

  timerInterval = setInterval(()=>{

    timerRemaining = Math.max(
      0,
      Math.ceil((deadline-Date.now())/1000)
    );

    renderTimer();

    if(timerRemaining<=0){

      clearInterval(timerInterval);

      timerRunning = false;

      $("#timerStart").textContent = "Iniciar";
      $("#timerStatus").textContent = "⏰ ¡Tiempo terminado!";

      $("#timerDisplay").classList.add("finished");

      setTimeout(()=>{
        $("#timerDisplay").classList.remove("finished");
      },3000);

      beep();

    }

  },200);

});

$("#timerReset").addEventListener("click",()=>{

  clearInterval(timerInterval);

  timerRunning = false;
  timerRemaining = timerTotal;

  $("#timerStart").textContent = "Iniciar";
  $("#timerStatus").textContent = "Preparado";

  renderTimer();

});

renderSW();
renderTimer();


/* FUNCIONAMIENTO OFFLINE */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("./service-worker.js")
      .catch(()=>{});

  });

}

</script>

</body>
</html>
